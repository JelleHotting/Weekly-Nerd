        <template class="blog-content-source">
          <h2 class="blog-title">Conceptuele Uitleg</h2>
          <p class="blog-text">Deze lezing behandelt de interne werking van webbrowsers en de geschiedenis van browserontwikkeling. Het begrijpen van hoe browsers HTML, CSS en JavaScript verwerken is cruciaal voor het optimaliseren van webpagina's en het voorkomen van performance problemen. De <strong>rendering engine</strong> en <strong>JavaScript engine</strong> zijn aparte componenten die elk hun eigen taak hebben in het verwerken van webpagina's.</p>
          <p class="blog-text"><strong>Waarom is dit belangrijk?</strong> Verkeerd gebruik van scripts en CSS kan leiden tot geblokkeerde rendering en trage laadtijden. Door te begrijpen hoe browsers werken, kun je slimmere keuzes maken over waar je scripts plaatst en hoe je ze laadt.</p>

          <h2 class="blog-title">Code Voorbeelden & Syntax</h2>
          <h3 class="blog-subtitle">Script Loading Strategieën</h3>
          <p class="blog-text">Browsers hebben verschillende manieren om JavaScript te laden zonder de HTML parsing te blokkeren:</p>
          <figure class="blog-code">
            <pre><code>&lt;!-- Async: laad het script parallel, voer uit zodra het klaar is --&gt;
&lt;script async src="script.js"&gt;&lt;/script&gt;

&lt;!-- Defer: laad parallel, maar voer pas uit na HTML parsing --&gt;
&lt;script defer src="script.js"&gt;&lt;/script&gt;

&lt;!-- Standaard: blokkeert HTML parsing tot script is uitgevoerd --&gt;
&lt;script src="script.js"&gt;&lt;/script&gt;</code></pre>
          </figure>
          <p class="blog-text"><strong>Defer</strong> is meestal de veiligste keuze voor scripts die de DOM manipuleren. De oude truc was om scripts onderaan de pagina te plaatsen, wat nog steeds werkt.</p>

          <h3 class="blog-subtitle">Legacy HTML Features (nog steeds werkend)</h3>
          <p class="blog-text">Door <strong>backward compatibility</strong> werken oude HTML features nog steeds in moderne browsers:</p>
          <figure class="blog-code">
            <pre><code>&lt;!-- Document.all - werkt nog steeds maar gebruik het niet --&gt;
&lt;script&gt;
  // Gebruik querySelector in plaats daarvan
  const element = document.querySelector('.classname');
&lt;/script&gt;

&lt;!-- Forms collecties --&gt;
&lt;form name="myForm"&gt;
  &lt;input name="username" type="text"&gt;
&lt;/form&gt;

&lt;script&gt;
  // Legacy manier (werkt nog steeds)
  document.forms.myForm.elements.username.value;
  
  // Moderne manier (gebruik deze)
  document.querySelector('form[name="myForm"] input[name="username"]').value;
&lt;/script&gt;</code></pre>
          </figure>

          <h3 class="blog-subtitle">Quirks Mode vs Standards Mode</h3>
          <p class="blog-text">Het <strong>doctype</strong> bepaalt welke rendering mode de browser gebruikt:</p>
          <figure class="blog-code">
            <pre><code>&lt;!-- MET doctype: Standards Mode (gebruik dit altijd) --&gt;
&lt;!DOCTYPE html&gt;
&lt;html&gt;
  &lt;head&gt;
    &lt;title&gt;Moderne pagina&lt;/title&gt;
  &lt;/head&gt;
  &lt;body&gt;
    &lt;!-- Content --&gt;
  &lt;/body&gt;
&lt;/html&gt;

&lt;!-- ZONDER doctype: Quirks Mode (gebruik NOOIT) --&gt;
&lt;html&gt;
  &lt;body&gt;
    &lt;!-- Dit triggert Internet Explorer 6 CSS compatibiliteit --&gt;
  &lt;/body&gt;
&lt;/html&gt;</code></pre>
          </figure>

          <h2 class="blog-title">Best Practices & Tips</h2>
          <h3 class="blog-subtitle">✅ Do's</h3>
          <ul class="blog-list">
            <li><strong>Gebruik altijd een doctype</strong> om quirks mode te vermijden</li>
            <li><strong>Plaats scripts onderaan</strong> of gebruik <code>defer</code> om HTML parsing niet te blokkeren</li>
            <li><strong>Hou layout berekeningen simpel</strong> - complexe layouts zijn duur voor de browser</li>
            <li><strong>Gebruik media queries en container queries</strong> om layout van tevoren te bepalen</li>
            <li><strong>Begrijp rendering engines</strong> - Chromium/Blink wordt gebruikt door Chrome, Edge, Vivaldi, Opera en meer</li>
          </ul>

          <h3 class="blog-subtitle">❌ Don'ts</h3>
          <ul class="blog-list">
            <li><strong>Geen scripts in de &lt;head&gt; zonder defer/async</strong> - dit blokkeert de hele pagina</li>
            <li><strong>Vermijd layout thrashing</strong> - wijzig layout niet tijdens rendering</li>
            <li><strong>Geen quirks mode</strong> - vergeet nooit je doctype</li>
            <li><strong>Gebruik geen legacy features</strong> zoals <code>document.all</code>, <code>&lt;blink&gt;</code>, <code>&lt;marquee&gt;</code> en <code>&lt;frameset&gt;</code></li>
          </ul>

          <h3 class="blog-subtitle">Browser Geschiedenis & Engines</h3>
          <p class="blog-text"><strong>Belangrijke momenten:</strong></p>
          <ul class="blog-list">
            <li><strong>Tim Berners-Lee</strong> ontwikkelde de eerste browser (1990)</li>
            <li><strong>Mosaic</strong> (1993) was de eerste user-friendly browser en introduceerde de <code>&lt;img&gt;</code> tag</li>
            <li><strong>Internet Explorer</strong> was de eerste browser op macOS</li>
            <li><strong>Konqueror</strong> (Linux) werd de basis voor <strong>Safari</strong> via WebKit</li>
            <li><strong>WebKit</strong> werd later geforkt door Google naar <strong>Blink</strong></li>
          </ul>
          <p class="blog-text"><strong>Moderne rendering engines:</strong></p>
          <ul class="blog-list">
            <li><strong>Blink</strong> (Chromium): Chrome, Edge, Opera, Vivaldi, Brave</li>
            <li><strong>WebKit</strong>: Safari</li>
            <li><strong>Gecko</strong>: Firefox</li>
          </ul>
          <p class="blog-text"><strong>Nieuwe browsers in ontwikkeling:</strong></p>
          <ul class="blog-list">
            <li><strong>Flow</strong> en <strong>Ladybird</strong> - onafhankelijke browsers die niet gebaseerd zijn op bestaande engines</li>
          </ul>

          <h3 class="blog-subtitle">Browser Architectuur</h3>
          <p class="blog-text"><strong>Belangrijke componenten:</strong></p>
          <ul class="blog-list">
            <li><strong>Rendering engine</strong> - verwerkt HTML, CSS en het DOM</li>
            <li><strong>JavaScript engine</strong> - interpreteert JavaScript code (volledig gescheiden)</li>
            <li><strong>Parser</strong> - leest HTML/CSS/JS streams en vertaalt naar browser instructies</li>
            <li><strong>Layout engine</strong> - berekent hoe elementen op het scherm moeten worden weergegeven</li>
          </ul>
          <p class="blog-text"><strong>Toegankelijkheid:</strong></p>
          <ul class="blog-list">
            <li><strong>AOM</strong> (Accessibility Object Model) - maakt webpaginas toegankelijk voor assistive technologies</li>
          </ul>

        <template class="blog-content-source">
          <h2 class="blog-title">Conceptuele Uitleg</h2>
          <p class="blog-text">Deze lezing gaat over het overbruggen van de kloof tussen creatieve coding en praktische webontwikkeling. De spreker (Nils van Nine Elements) betoogt dat moderne tools zoals Figma, Tailwind en AI ervoor hebben gezorgd dat we steeds sneller dezelfde saaie layouts kunnen bouwen, maar dat CSS veel meer mogelijkheden biedt dan wat in Figma mogelijk is. Het doel is om te laten zien hoe je met moderne CSS-technieken creatieve, unieke websites kunt bouwen die zich onderscheiden van de standaard "hero + three boxes + CTA + footer" layouts.</p>
          <p class="blog-text"><strong>Waarom is dit belangrijk?</strong> Tools zoals Figma zijn ontworpen met development in gedachten (auto layout werkt zoals Flexbox, box shadows matchen CSS syntax), maar hebben ons niet creatiever gemaakt—alleen sneller. Er is meer mogelijk op het web dan in Figma.</p>

          <h2 class="blog-title">Code Voorbeelden & Syntax</h2>
          <h3 class="blog-subtitle">Grid Layout met FR Units voor White Space Distributie</h3>
          <p class="blog-text">Het <strong>FR (fraction) unit</strong> verdeelt beschikbare ruimte proportioneel.</p>
          <figure class="blog-code">
            <pre><code>.container {
  display: grid;
  grid-template-columns: 2fr 3fr auto 1fr;
  /* 2fr, 3fr, 1fr verdelen beschikbare ruimte in ratio 2:3:1 */
  /* auto neemt alleen de ruimte die nodig is voor content */
}

.headline {
  grid-column: 2 / 4; /* Start op kolom 2, eindigt voor kolom 4 */
}

.paragraph {
  grid-column: 3 / 4;
  max-width: 65ch; /* Geeft de auto-kolom een breedte */
}</code></pre>
          </figure>
          <p class="blog-text">Dit zorgt voor dynamische layouts waarbij white space automatisch wordt verdeeld wanneer er ruimte beschikbaar is.</p>

          <h3 class="blog-subtitle">Steps Animation voor Flipbook Effecten</h3>
          <p class="blog-text">In plaats van video's kun je een image strip gebruiken met <strong>steps()</strong> timing function.</p>
          <figure class="blog-code">
            <pre><code>.keyvisual {
  background-image: url('sprite-strip-32-frames.png');
  background-size: 3200% 100%; /* 32 frames naast elkaar */
  animation: stop-motion 3s steps(31, end) infinite;
  /* 31 steps voor 32 frames (eerste frame = stap 0) */
}

@keyframes stop-motion {
  from {
    background-position: 0% 100%;
  }
  to {
    background-position: 100% 100%;
  }
}</code></pre>
          </figure>
          <p class="blog-text"><strong>Steps()</strong> zorgt ervoor dat de animatie niet smooth overgaat maar in discrete stappen springt, waardoor je een flipbook-effect krijgt zonder video te gebruiken.</p>

          <h3 class="blog-subtitle">Subgrid voor Multi-Stage Timetables</h3>
          <p class="blog-text"><strong>Subgrid</strong> laat child elements de grid tracks van hun parent hergebruiken.</p>
          <figure class="blog-code">
            <pre><code>.timetable-body {
  display: grid;
  grid-template-rows: repeat(288, 1fr); 
  /* 24 uur × 12 rows = 288 (elk row = 5 minuten) */
}

.stage {
  display: grid;
  grid-template-rows: subgrid; /* Hergebruikt parent rows */
  grid-row: 1 / -1; /* Stretch over alle rows */
}

.session {
  /* Gebruik custom properties voor start/end tijden */
  --start: 144; /* 12:00 = row 144 */
  --end: 180;   /* 15:00 = row 180 */
  grid-row: var(--start) / var(--end);
}</code></pre>
          </figure>
          <p class="blog-text">Voordeel: wanneer één sessie groter wordt (meer tekst), groeien alle parallelle tracks mee.</p>

          <h3 class="blog-subtitle">Sticky Elements in Horizontale Scroll Container</h3>
          <figure class="blog-code">
            <pre><code>.timetable-body {
  overflow-x: auto;
  overflow-y: visible;
}

.hour-indicator {
  position: sticky;
  left: 0; /* Sticky binnen horizontal scroll container */
}</code></pre>
          </figure>
          <p class="blog-text">Voor verticale sticky headers buiten de scroll container gebruik je een <strong>fake element</strong> met scroll-driven animation.</p>
          <figure class="blog-code">
            <pre><code>.timetable-head {
  position: sticky;
  top: 0;
  animation: slide linear;
  animation-timeline: scroll(x); /* Gekoppeld aan horizontale scroll */
}

@keyframes slide {
  from { transform: translateX(0); }
  to { transform: translateX(var(--scroll-distance)); }
}</code></pre>
          </figure>

          <h3 class="blog-subtitle">First-Line Selector voor Outline Effect</h3>
          <figure class="blog-code">
            <pre><code>p::first-line {
  font-size: 1.2rem;
  font-weight: bold;
  text-decoration: underline;
  /* Of gebruik outline text effect */
  -webkit-text-stroke: 1px black;
  -webkit-text-fill-color: transparent;
}</code></pre>
          </figure>
          <p class="blog-text">De <strong>::first-line</strong> pseudo-element past styling toe op alleen de eerste regel van een tekstblok. Dit past dynamisch aan bij viewport changes.</p>

          <h3 class="blog-subtitle">View Transitions voor Page Navigatie</h3>
          <figure class="blog-code">
            <pre><code>/* Geef elementen een view-transition-name */
.logo {
  view-transition-name: site-logo;
}

.page-indicator {
  view-transition-name: nav-indicator;
}</code></pre>
          </figure>
          <p class="blog-text">Wanneer je navigeert naar een nieuwe pagina met dezelfde <strong>view-transition-name</strong>, animeert de browser automatisch tussen de twee posities. Werkt als "Smart Animate" in Figma.</p>

          <h3 class="blog-subtitle">Blend Modes voor Kleur Inversie</h3>
          <figure class="blog-code">
            <pre><code>.keyvisual {
  background-image: url('black-white-image.png');
  mix-blend-mode: difference; /* Inverteert achtergrondkleuren */
}</code></pre>
          </figure>
          <p class="blog-text">Een zwart-wit image met <strong>blend mode difference</strong> inverteert de kleuren van de achtergrond, waardoor je verschillende kleureffecten krijgt op verschillende achtergronden zonder meerdere assets.</p>

          <h2 class="blog-title">Best Practices & Tips</h2>
          <h3 class="blog-subtitle">✅ Do's</h3>
          <ul class="blog-list">
            <li><strong>Denk in ratio's, niet in pixels:</strong> Kijk naar verhoudingen tussen elementen (1:2:3) in plaats van exacte pixel waarden</li>
            <li><strong>Gebruik FR units voor white space:</strong> Perfect voor asymmetrische layouts waar lege kolommen dynamisch moeten schalen</li>
            <li><strong>Steps() voor animations:</strong> Bespaar bandbreedte door image strips te gebruiken in plaats van video's</li>
            <li><strong>Subgrid voor complexe layouts:</strong> Wanneer child elements moeten alignen met parent grid tracks</li>
            <li><strong>First-line selector:</strong> Voor typografische effecten die alleen de eerste regel stylen</li>
            <li><strong>View transitions:</strong> Voor smooth page navigaties zonder JavaScript frameworks</li>
          </ul>

          <h3 class="blog-subtitle">❌ Don'ts</h3>
          <ul class="blog-list">
            <li><strong>Geen video's als je het kan vermijden:</strong> Image strips met steps() zijn lichter en flexibeler</li>
            <li><strong>Niet alles centreren:</strong> Asymmetrische layouts met FR units zijn interessanter</li>
            <li><strong>Niet alles aan AI overlaten:</strong> AI repliceert alleen bestaande patronen, geen creatieve layouts</li>
          </ul>

          <h3 class="blog-subtitle">Toegankelijkheid & Browser Support</h3>
          <ul class="blog-list">
            <li><strong>Sticky positioning</strong> werkt alleen binnen scroll containers, niet cross-container</li>
            <li><strong>Subgrid</strong> heeft goede browser support (check <a href="https://caniuse.com" target="_blank" rel="noopener noreferrer">caniuse.com</a>)</li>
            <li><strong>View transitions</strong> zijn relatief nieuw, gebruik progressive enhancement</li>
          </ul></p>

          <ul class="blog-list">
            <li><strong>Gebruik altijd een doctype</strong> om quirks mode te vermijden</li>
            <li><strong>Plaats scripts onderaan</strong> of gebruik <code>defer</code> om HTML parsing niet te blokkeren</li>
            <li><strong>Hou layout berekeningen simpel</strong> - complexe layouts zijn duur voor de browser</li>
            <li><strong>Gebruik media queries en container queries</strong> om layout van tevoren te bepalen</li>
            <li><strong>Begrijp rendering engines</strong> - Chromium/Blink wordt gebruikt door Chrome, Edge, Vivaldi, Opera en meer</li>
          </ul>

          <h3 class="blog-subtitle">❌ Don'ts</h3>
          <ul class="blog-list">
            <li><strong>Geen scripts in de &lt;head&gt; zonder defer/async</strong> - dit blokkeert de hele pagina</li>
            <li><strong>Vermijd layout thrashing</strong> - wijzig layout niet tijdens rendering</li>
            <li><strong>Geen quirks mode</strong> - vergeet nooit je doctype</li>
            <li><strong>Gebruik geen legacy features</strong> zoals <code>document.all</code>, <code>&lt;blink&gt;</code>, <code>&lt;marquee&gt;</code> en <code>&lt;frameset&gt;</code></li>
          </ul>

          <h3 class="blog-subtitle">Browser Geschiedenis & Engines</h3>
          <p class="blog-text"><strong>Belangrijke momenten:</strong></p>
          <ul class="blog-list">
            <li><strong>Tim Berners-Lee</strong> ontwikkelde de eerste browser (1990)</li>
            <li><strong>Mosaic</strong> (1993) was de eerste user-friendly browser en introduceerde de <code>&lt;img&gt;</code> tag</li>
            <li><strong>Internet Explorer</strong> was de eerste browser op macOS</li>
            <li><strong>Konqueror</strong> (Linux) werd de basis voor <strong>Safari</strong> via WebKit</li>
            <li><strong>WebKit</strong> werd later geforkt door Google naar <strong>Blink</strong></li>
          </ul>
          <p class="blog-text"><strong>Moderne rendering engines:</strong></p>
          <ul class="blog-list">
            <li><strong>Blink</strong> (Chromium): Chrome, Edge, Opera, Vivaldi, Brave</li>
            <li><strong>WebKit</strong>: Safari</li>
            <li><strong>Gecko</strong>: Firefox</li>
          </ul>
          <p class="blog-text"><strong>Nieuwe browsers in ontwikkeling:</strong></p>
          <ul class="blog-list">
            <li><strong>Flow</strong> en <strong>Ladybird</strong> - onafhankelijke browsers die niet gebaseerd zijn op bestaande engines</li>
          </ul>

          <h3 class="blog-subtitle">Browser Architectuur</h3>
          <p class="blog-text"><strong>Belangrijke componenten:</strong></p>
          <ul class="blog-list">
            <li><strong>Rendering engine</strong> - verwerkt HTML, CSS en het DOM</li>
            <li><strong>JavaScript engine</strong> - interpreteert JavaScript code (volledig gescheiden)</li>
            <li><strong>Parser</strong> - leest HTML/CSS/JS streams en vertaalt naar browser instructies</li>
            <li><strong>Layout engine</strong> - berekent hoe elementen op het scherm moeten worden weergegeven</li>
          </ul>
          <p class="blog-text"><strong>Toegankelijkheid:</strong></p>
          <ul class="blog-list">
            <li><strong>AOM</strong> (Accessibility Object Model) - maakt webpaginas toegankelijk voor assistive technologies</li>
          </ul>
